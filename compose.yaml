services:
  rabbitmq:
    image: docker.io/rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI (guest/guest, nur lokal)
    volumes:
      - ./rabbitmq/data:/var/lib/rabbitmq:Z
    cpus: 2.0
    mem_limit: 2g

  kafka:
    image: docker.io/apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - ./kafka/data:/var/lib/kafka/data:Z
    cpus: 2.0
    mem_limit: 2g

  #kafka-ui:
  #  image: docker.io/provectuslabs/kafka-ui:latest
  #  container_name: kafka-ui
  #  ports:
  #    - "8080:8080"
  #  environment:
  #    KAFKA_CLUSTERS_0_NAME: local
  #    KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
  #  cpus: 1.0
  #  mem_limit: 512m

  ibmmq:
    image: icr.io/ibm-messaging/mq:latest
    container_name: ibmmq
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: QM1
      MQ_APP_PASSWORD: app12345
      MQ_ADMIN_PASSWORD: admin12345
    ports:
      - "1414:1414"     # MQ Listener
      - "9443:9443"     # Web Console (admin/admin12345)
    volumes:
      - ./ibmmq/data:/mnt/mqm:Z
    cpus: 2.0
    mem_limit: 2g